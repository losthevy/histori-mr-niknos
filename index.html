<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lomba Tracker Mr Niknos</title>
    <meta name="theme-color" content="#f5f6fa" />
    <style>
      :root {
        --bg: #f5f6fa;
        --card: #fff;
        --ink: #1b2030;
        --soft: #687086;
        --line: #e2e5ee;
        --main: #2f55d4;
        --main-soft: #e7ecfc;
        --ok: #0f7a5a;
        --ok-soft: #e3f3ec;
        --warn: #b4540a;
        --warn-soft: #fdeedd;
        --bad: #b3261e;
        --bad-soft: #fbe9e7;
        --r: 14px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding-bottom: 96px;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 16px;
      }
      header {
        padding: 20px 0 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 1rem;
        margin: 0;
      }
      h3 {
        font-size: 0.8rem;
        margin: 18px 0 8px;
        color: var(--soft);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .muted {
        color: var(--soft);
        font-size: 0.875rem;
      }
      select,
      input,
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      select,
      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        min-height: 46px;
      }
      select:focus,
      input:focus,
      button:focus-visible {
        outline: 2px solid var(--main);
        outline-offset: 2px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: var(--soft);
      }
      .who select {
        width: auto;
        min-height: 40px;
        padding: 6px 10px;
        font-weight: 600;
        color: var(--ink);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, 1fr);
      }
      .stat {
        margin: 0;
      }
      .stat .n {
        font-weight: 700;
        font-size: 1.5rem;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .next {
        background: var(--main);
        color: #fff;
        border: 0;
        margin-top: 12px;
      }
      .next .muted {
        color: #fff;
        opacity: 0.85;
      }
      .next .big {
        font-size: 1.25rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 16px 0 4px;
      }
      .tabs button {
        flex: 1;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 9px 16px;
        cursor: pointer;
        color: var(--soft);
        font-weight: 600;
        font-size: 0.9rem;
      }
      .tabs button[aria-selected="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .lhead {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .lhead h2 {
        overflow-wrap: anywhere;
      }
      .days {
        font-weight: 700;
        white-space: nowrap;
        font-size: 0.9rem;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .d-ok {
        background: var(--main-soft);
        color: var(--main);
      }
      .d-soon {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .d-late {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .d-done {
        background: #eef0f4;
        color: var(--soft);
      }
      .chip {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .due {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin: 14px 0 6px;
      }
      .steps button {
        border: 0;
        background: #e9ecf3;
        color: var(--soft);
        padding: 8px 4px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        min-height: 40px;
        border-radius: 6px;
        line-height: 1.2;
      }
      .steps button.on {
        background: var(--main);
        color: #fff;
      }
      .steps button.now {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      .foot {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 10px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-weight: 600;
        cursor: pointer;
        min-height: 46px;
        background: var(--main);
        color: #fff;
      }
      .btn.alt {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.sm {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.85rem;
      }
      .btn.ghost {
        background: none;
        color: var(--soft);
        padding: 6px 8px;
        min-height: 32px;
        font-size: 0.8rem;
        font-weight: 500;
        text-decoration: underline;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(245, 246, 250, 0.94);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--line);
        padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      }
      .bar .btn {
        width: 100%;
      }
      dialog {
        border: 0;
        border-radius: 18px;
        padding: 0;
        width: min(480px, calc(100vw - 24px));
        max-height: calc(100dvh - 24px);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(20, 25, 40, 0.45);
      }
      dialog form {
        padding: 20px;
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 46px;
        cursor: pointer;
      }
      .check input {
        width: 20px;
        height: 20px;
        min-height: 0;
        padding: 0;
        accent-color: var(--main);
        flex: none;
      }
      .acts {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .acts .btn {
        flex: 1;
      }
      .note {
        background: var(--warn-soft);
        color: #6b3305;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.875rem;
        margin-bottom: 12px;
      }
      .empty {
        color: var(--soft);
        text-align: center;
        padding: 18px 0;
        font-size: 0.9rem;
      }
      .log {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .log:first-child {
        border-top: 0;
      }
      .log .t {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 92px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 0.875rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        max-width: calc(100vw - 32px);
        text-align: center;
        z-index: 9;
      }
      #toast.on {
        opacity: 1;
      }
      .hide {
        display: none;
      }
      @media (max-width: 480px) {
        .grid {
          gap: 8px;
        }
        .card.stat {
          padding: 12px;
        }
        .stat .n {
          font-size: 1.25rem;
        }
        .stat .muted {
          font-size: 0.78rem;
        }
      }
    
      .hbtn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      .tabs button{padding:9px 4px;font-size:.82rem}
      .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
      .tools input{flex:1 1 100%}
      .tools select{flex:1 1 30%;min-width:0;font-size:.85rem}
      .star{color:#e0a100;margin-right:4px}
      .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
      .tg{background:var(--main-soft);color:var(--main);text-decoration:none}
      .cl{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
      .clh{display:flex;align-items:center;gap:10px}
      .pg{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
      .pg i{display:block;height:100%;background:var(--ok)}
      .ci{display:flex;align-items:center;gap:6px}
      .ck{display:flex;flex:1;align-items:center;gap:8px;font-weight:500;padding:6px 0;cursor:pointer}
      .ck input{width:18px;height:18px;min-height:0;padding:0;flex:none;accent-color:var(--main)}
      .strk{text-decoration:line-through;color:var(--soft)}
      .x{border:0;background:none;color:var(--soft);font-size:1.2rem;cursor:pointer;min-width:32px;min-height:32px}
      .cadd{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
      .cadd input{flex:1;min-height:36px;padding:6px 10px;font-size:.9rem}
      .warn-card{background:var(--warn-soft);border-color:transparent;margin-top:12px}
      .dot{display:inline-block;width:7px;height:7px;border-radius:50%}
      .dot.d-ok{background:var(--main)}.dot.d-soon{background:var(--warn)}.dot.d-late{background:var(--bad)}.dot.d-done{background:var(--soft)}
      .tl{position:relative;margin:12px 0 0 6px;padding-left:22px;border-left:2px solid var(--line)}
      .tl-m{font-size:.8rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
      .tl-i{position:relative;margin-bottom:10px}
      .tl-i .card{margin:0}
      .tl-i .dot{position:absolute;left:-30px;top:18px;width:12px;height:12px;box-shadow:0 0 0 3px var(--bg)}
      .tl-i.dim{opacity:.55}
      .tl-now{position:relative;margin:14px 0}
      .tl-now:before{content:"";position:absolute;left:-29px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
      .tl-now span{display:block;border-top:2px solid var(--ink);padding-top:3px;font-size:.78rem;font-weight:700}
      .lnk{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:1rem;cursor:pointer;overflow-wrap:anywhere;color:inherit}
      .calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
      .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
      .cg small{color:var(--soft);font-weight:600}
      .cd{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
      .cd.today{border-color:var(--main);font-weight:700}
      .cd.sel{background:var(--main);color:#fff}
      .dots{display:flex;gap:2px;height:7px}
      [data-theme=dark]{--bg:#12151d;--card:#1b2030;--ink:#e8ebf4;--soft:#9aa3ba;--line:#2b3247;--main:#6f8cff;--main-soft:#232c52;--ok:#4cc79f;--ok-soft:#14342a;--warn:#f0a35c;--warn-soft:#3a2810;--bad:#ff8a80;--bad-soft:#3b1b19}
      [data-theme=dark] select,[data-theme=dark] input,[data-theme=dark] .tabs button,[data-theme=dark] .btn.alt,[data-theme=dark] dialog{background:var(--card)}
      [data-theme=dark] .steps button,[data-theme=dark] .d-done{background:#252c40}
      [data-theme=dark] .bar{background:rgba(18,21,29,.94)}
      [data-theme=dark] .tabs button[aria-selected="true"],[data-theme=dark] .next,[data-theme=dark] .btn:not(.alt):not(.ghost),[data-theme=dark] .steps button.on{color:#0f1220}
      [data-theme=dark] .note{color:#f3c99c}
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Lomba Tracker Mr Niknos</h1>
          <div class="muted" id="sync">Memuat data...</div>
        </div>
        <div class="hbtn"><label class="who" style="font-weight: 400"
          >Saya
          <select id="me" aria-label="Pilih nama kamu"></select>
        </label><button class="btn alt sm" id="bAlat">Alat</button><button class="btn alt sm" id="bTema" aria-label="Ganti tema">🌙</button></div>
      </header>

      <div id="setup" class="note hide">
        Aplikasi belum tersambung ke Google Sheets. Isi <b>API_URL</b> di bagian
        atas skrip pada index.html dengan URL Web app dari Apps Script.
      </div>

      <div id="ringkas"></div>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="lomba" aria-selected="true">Daftar</button>
        <button role="tab" data-tab="timeline" aria-selected="false">Timeline</button>
        <button role="tab" data-tab="kalender" aria-selected="false">Kalender</button>
        <button role="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
      </nav>
      <div class="tools" id="tools">
        <input id="q" type="search" placeholder="Cari nama, catatan, kategori..." aria-label="Cari lomba" />
        <select id="fSt" aria-label="Filter status">
          <option value="">Semua status</option><option value="aktif">Perlu dikerjakan</option>
          <option value="tunggu">Menunggu hasil</option><option value="selesai">Selesai</option>
          <option value="noreg">Belum registrasi</option>
        </select>
        <select id="fPj" aria-label="Filter PJ"></select>
        <select id="fKat" aria-label="Filter kategori"></select>
      </div>

      <main id="view"></main>
    </div>

    <div class="bar">
      <div class="wrap">
        <button class="btn" id="bTambah">+ Tambah lomba</button>
      </div>
    </div>

    <dialog id="dLomba">
      <form method="dialog" id="fLomba">
        <h2 id="dJudul">Tambah lomba</h2>
        <input type="hidden" name="id" />
        <label
          >Nama lomba<input
            name="nama"
            maxlength="100"
            required
            placeholder="Contoh: RECYTAX 2026"
        /></label>
        <label
          >Deadline pengumpulan karya<input
            name="deadline"
            type="date"
            required
        /></label>
        <label class="check"
          ><input type="checkbox" name="registrasi" /> Sudah registrasi</label
        >
        <label
          >Catatan<input
            name="catatan"
            maxlength="200"
            placeholder="Opsional, misalnya tautan atau subtema"
        /></label>
        <label>Kategori<select name="kat" id="fmKat"></select></label>
        <label>Penanggung jawab (PJ)<select name="pj" id="fmPj"></select></label>
        <label>Tautan guidebook / pendaftaran<input name="link" maxlength="300" placeholder="Opsional, https://..." /></label>
        <div class="muted" style="font-size:.78rem">Kategori, PJ, tautan, checklist, dan bintang tersimpan di perangkat ini.</div>
        <div class="acts">
          <button type="button" class="btn alt" id="bBatal">Batal</button
          ><button class="btn" value="ok">Simpan</button>
        </div>
      </form>
    </dialog>

    <dialog id="dAlat">
      <div style="padding:20px;display:grid;gap:10px">
        <h2>Alat bantu</h2>
        <button class="btn alt" id="aIcs">Ekspor deadline ke kalender (.ics)</button>
        <button class="btn alt" id="aRekap">Salin rekap untuk grup WhatsApp</button>
        <button class="btn alt" id="aNotif">Aktifkan pengingat deadline</button>
        <button class="btn alt" id="aBackup">Backup data lokal (.json)</button>
        <label class="btn alt" style="text-align:center;display:block">Pulihkan backup<input type="file" id="aRestore" accept=".json" hidden /></label>
        <button class="btn" id="aTutup">Tutup</button>
      </div>
    </dialog>

    <div id="toast" role="status"></div>

    <script>
      /* ====== ISI INI dengan URL Web app Apps Script (berakhiran /exec) ====== */
      const API_URL =
        "https://script.google.com/macros/s/AKfycbx8jr2TFnUDN4oKbUi9JMaHKoTzDyNz0CJ9ExMt3M8NkLfbFKi6bYt5mMywYiPRxcRU/exec";
      /* ====================================================================== */

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const store = {
        get: (k) => {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem(k, v);
          } catch {}
        },
      };

      let D = {
        anggota: ["Akbar", "Ocid", "Psan"],
        progres: ["Belum mulai", "Dikerjakan", "Terkumpul", "Selesai"],
        lomba: [],
        riwayat: [],
      };
      let tab = "lomba",
        busy = false;

      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.remove("on"), 2800);
      }
      const me = () => $("#me").value;

      async function api(body) {
        if (!API_URL) {
          $("#setup").classList.remove("hide");
          $("#sync").textContent = "Belum tersambung";
          return false;
        }
        if (busy) return false;
        busy = true;
        $("#sync").textContent = body ? "Menyimpan..." : "Memuat data...";
        try {
          // text/plain supaya browser tidak mengirim preflight, yang tidak dilayani Apps Script
          const r = await fetch(
            API_URL,
            body
              ? {
                  method: "POST",
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ ...body, oleh: me() }),
                }
              : {},
          );
          const j = await r.json();
          if (!j.ok) throw new Error(j.error || "Gagal");
          D = j.data;
          $("#sync").textContent =
            "Tersinkron " +
            new Date().toLocaleTimeString("id-ID", {
              hour: "2-digit",
              minute: "2-digit",
            });
          render();
          if (!body) ingat();
          return true;
        } catch (e) {
          $("#sync").textContent = "Gagal tersambung";
          toast(
            e.message === "Failed to fetch"
              ? "Tidak bisa menghubungi server. Cek koneksi atau URL."
              : e.message,
          );
          return false;
        } finally {
          busy = false;
        }
      }

      /* ---------- Tanggal ---------- */
      const tglDl = (s) => {
        const [y, m, d] = String(s).split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const fmtDl = (s) => {
        const d = tglDl(s);
        return isNaN(d)
          ? "Tanggal belum diisi"
          : d.toLocaleDateString("id-ID", {
              weekday: "long",
              day: "numeric",
              month: "long",
              year: "numeric",
            });
      };
      const sisa = (s) => {
        const n = new Date();
        return Math.round(
          (tglDl(s) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) /
            864e5,
        );
      };
      const fmtWaktu = (s) => {
        const d = new Date(s);
        return isNaN(d)
          ? ""
          : d.toLocaleString("id-ID", {
              day: "numeric",
              month: "short",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
      };

      // Lomba dianggap beres dari sisi deadline bila karyanya sudah terkumpul
      const beres = (l) => D.progres.indexOf(l.progres) >= 2;
      const selesai = (l) => l.progres === "Selesai";

      function hitung(l) {
        if (beres(l))
          return [
            "d-done",
            l.progres === "Selesai" ? "Selesai" : "Sudah terkumpul",
          ];
        const n = sisa(l.deadline);
        if (isNaN(n)) return ["d-done", "Tanpa tanggal"];
        if (n < 0) return ["d-late", `Lewat ${-n} hari`];
        if (n === 0) return ["d-late", "Hari ini"];
        if (n === 1) return ["d-soon", "Besok"];
        return [n <= 7 ? "d-soon" : "d-ok", `${n} hari lagi`];
      }

      /* ---------- Data lokal tambahan ---------- */
      const KAT = ["Esai", "Karya Tulis Ilmiah", "Poster / Desain", "Video", "Business Plan", "Lainnya"];
      const TPL = ["Baca guidebook", "Registrasi", "Riset & data", "Draf naskah", "Lampiran / gambar", "Cek plagiasi & format", "Submit"];
      let M = {};
      try { M = JSON.parse(store.get("niknos_meta") || "{}"); } catch {}
      const mt = (id) => M[id] || {};
      const upM = (id, o) => { M[id] = { ...mt(id), ...o }; store.set("niknos_meta", JSON.stringify(M)); };
      const urut = (a, b) => tglDl(a.deadline) - tglDl(b.deadline) || 0;
      const kunci = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      let cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: null };

      function saring() {
        const q = $("#q").value.trim().toLowerCase(), s = $("#fSt").value, p = $("#fPj").value, k = $("#fKat").value;
        return D.lomba.filter((l) => {
          const m = mt(l.id);
          if (q && !(l.nama + " " + l.catatan + " " + (m.kat || "")).toLowerCase().includes(q)) return false;
          if (p && (p === "-" ? m.pj : m.pj !== p)) return false;
          if (k && m.kat !== k) return false;
          if (s === "aktif") return !beres(l);
          if (s === "tunggu") return beres(l) && !selesai(l);
          if (s === "selesai") return selesai(l);
          if (s === "noreg") return l.registrasi !== "Sudah" && !selesai(l);
          return true;
        });
      }

      function urgent() {
        const r = [];
        D.lomba.filter((l) => !beres(l)).forEach((l) => {
          const n = sisa(l.deadline);
          if (isNaN(n)) return;
          if (n < 0) r.push({ l, t: `lewat ${-n} hari`, p: 0 });
          else if (n <= 3) r.push({ l, t: n ? `${n} hari lagi` : "hari ini", p: 1 });
          else if (l.registrasi !== "Sudah" && n <= 14) r.push({ l, t: "belum registrasi", p: 2 });
        });
        return r.sort((a, b) => a.p - b.p);
      }

      /* ---------- Tampilan ---------- */
      function vRingkas() {
        const jalan = D.lomba.filter((l) => !selesai(l));
        const belumReg = jalan.filter((l) => l.registrasi !== "Sudah");
        const dkt = jalan.filter((l) => !beres(l) && !isNaN(sisa(l.deadline))).sort(urut)[0];
        const u = urgent();
        const pct = D.lomba.length ? Math.round(((D.lomba.length - jalan.length) / D.lomba.length) * 100) : 0;
        return (
          `<div class="grid">
    <div class="card stat"><div class="muted">Sedang diikuti</div><div class="n">${jalan.length}</div></div>
    <div class="card stat"><div class="muted">Belum registrasi</div><div class="n" style="color:${belumReg.length ? "var(--warn)" : "inherit"}">${belumReg.length}</div></div>
    <div class="card stat"><div class="muted">Sudah selesai</div><div class="n">${D.lomba.length - jalan.length}</div><div class="pg" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
  </div>` +
          (dkt ? `<div class="card next"><div class="muted">Deadline terdekat</div>
    <div class="big">${esc(dkt.nama)}</div><div>${fmtDl(dkt.deadline)} · ${hitung(dkt)[1].toLowerCase()}</div></div>` : "") +
          (u.length ? `<div class="card warn-card"><b>Perlu perhatian</b>${u.slice(0, 4).map((x) => `<div class="muted">• ${esc(x.l.nama)} — ${x.t}</div>`).join("")}${u.length > 4 ? `<div class="muted">+${u.length - 4} lainnya</div>` : ""}</div>` : "")
        );
      }

      function kartu(l) {
        const [kls, teks] = hitung(l);
        const idx = D.progres.indexOf(l.progres), reg = l.registrasi === "Sudah";
        const m = mt(l.id), cl = m.cl || [], done = cl.filter((c) => c.d).length;
        const gc = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("Deadline: " + l.nama)}&dates=${ymd(l.deadline)}/${esok(l.deadline)}`;
        return `<div class="card">
    <div class="lhead"><h2>${m.pin ? '<span class="star">★</span>' : ""}${esc(l.nama)}</h2><span class="days ${kls}">${teks}</span></div>
    <div class="muted">Deadline ${fmtDl(l.deadline)}</div>
    <div class="tags">${m.kat ? `<span class="chip tg">${esc(m.kat)}</span>` : ""}${m.pj ? `<span class="chip tg">PJ: ${esc(m.pj)}</span>` : ""}${m.link ? `<a class="chip tg" href="${esc(m.link)}" target="_blank" rel="noopener">Buka tautan ↗</a>` : ""}</div>
    ${l.catatan ? `<div class="muted" style="overflow-wrap:anywhere">${esc(l.catatan)}</div>` : ""}
    <div class="steps" role="group" aria-label="Progres ${esc(l.nama)}">
      ${D.progres.map((p, i) => `<button class="${i <= idx ? "on" : ""} ${i === idx ? "now" : ""}" data-progres="${esc(p)}" data-id="${esc(l.id)}" aria-pressed="${i === idx}">${esc(p)}</button>`).join("")}
    </div>
    <div class="cl"><div class="clh"><span class="muted">Checklist ${done}/${cl.length}</span>${cl.length ? `<div class="pg"><i style="width:${Math.round((done / cl.length) * 100)}%"></i></div>` : ""}</div>
      ${cl.map((c, i) => `<div class="ci"><label class="ck"><input type="checkbox" data-ck="${i}" data-id="${esc(l.id)}" ${c.d ? "checked" : ""}><span class="${c.d ? "strk" : ""}">${esc(c.t)}</span></label><button class="x" data-cx="${i}" data-id="${esc(l.id)}" aria-label="Hapus langkah">×</button></div>`).join("")}
      <div class="cadd"><input data-ci="${esc(l.id)}" placeholder="Tambah langkah..." maxlength="80"><button class="btn alt sm" data-ca="${esc(l.id)}">Tambah</button>${cl.length ? "" : `<button class="btn ghost" data-tpl="${esc(l.id)}">Pakai template</button>`}</div>
    </div>
    <div class="foot">
      <span class="chip ${reg ? "ok" : "due"}">${reg ? "Sudah registrasi" : "Belum registrasi"}</span>
      <button class="btn alt sm" data-reg="${reg ? 0 : 1}" data-id="${esc(l.id)}">${reg ? "Batalkan registrasi" : "Tandai sudah registrasi"}</button>
      <button class="btn alt sm" data-pin="${esc(l.id)}" aria-label="Bintangi">${m.pin ? "★ Prioritas" : "☆ Prioritas"}</button>
      <a class="btn ghost" href="${gc}" target="_blank" rel="noopener">+ Google Calendar</a>
      <span style="flex:1"></span>
      <button class="btn ghost" data-edit="${esc(l.id)}">Ubah</button>
      <button class="btn ghost" data-del="${esc(l.id)}">Hapus</button>
    </div>
    <div class="muted" style="margin-top:6px;font-size:.78rem">Ditambahkan ${esc(l.dibuat_oleh)}</div>
  </div>`;
      }

      function vLomba() {
        if (!D.lomba.length) return '<div class="card empty">Belum ada lomba. Tekan Tambah lomba di bawah untuk mulai mencatat.</div>';
        const a = saring();
        if (!a.length) return '<div class="card empty">Tidak ada lomba yang cocok dengan filter.</div>';
        const u = (x, y) => (mt(y.id).pin ? 1 : 0) - (mt(x.id).pin ? 1 : 0) || urut(x, y);
        const blok = (j, arr) => (arr.length ? `<h3>${j} (${arr.length})</h3>` + arr.map(kartu).join("") : "");
        return (
          blok("Perlu dikerjakan", a.filter((l) => !beres(l)).sort(u)) +
          blok("Sudah terkumpul, menunggu hasil", a.filter((l) => beres(l) && !selesai(l)).sort(u)) +
          blok("Selesai", a.filter(selesai).sort((x, y) => urut(y, x)))
        );
      }

      function vTimeline() {
        const a = saring().filter((l) => !isNaN(sisa(l.deadline))).sort(urut);
        if (!a.length) return '<div class="card empty" style="margin-top:12px">Belum ada lomba bertanggal yang cocok.</div>';
        const now = `<div class="tl-now"><span>Hari ini · ${new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long" })}</span></div>`;
        let h = '<div class="tl">', bulan = "", ditandai = false;
        a.forEach((l) => {
          if (!ditandai && sisa(l.deadline) >= 0) { h += now; ditandai = true; }
          const d = tglDl(l.deadline), bl = d.toLocaleDateString("id-ID", { month: "long", year: "numeric" });
          if (bl !== bulan) { bulan = bl; h += `<div class="tl-m">${bl}</div>`; }
          const [kls, teks] = hitung(l), m = mt(l.id), cl = m.cl || [];
          h += `<div class="tl-i ${beres(l) ? "dim" : ""}"><i class="dot ${kls}"></i><div class="card">
      <div class="lhead"><button class="lnk" data-edit="${esc(l.id)}">${m.pin ? "★ " : ""}${esc(l.nama)}</button><span class="days ${kls}">${teks}</span></div>
      <div class="muted">${d.toLocaleDateString("id-ID", { weekday: "short", day: "numeric", month: "short" })} · ${esc(l.progres)}${m.pj ? " · PJ " + esc(m.pj) : ""}${m.kat ? " · " + esc(m.kat) : ""}${cl.length ? ` · ✓ ${cl.filter((c) => c.d).length}/${cl.length}` : ""}${l.registrasi !== "Sudah" ? " · belum registrasi" : ""}</div></div></div>`;
        });
        if (!ditandai) h += now;
        return h + "</div>";
      }

      function vKalender() {
        const by = {};
        saring().forEach((l) => (by[l.deadline] = by[l.deadline] || []).push(l));
        const first = new Date(cal.y, cal.m, 1), off = (first.getDay() + 6) % 7, n = new Date(cal.y, cal.m + 1, 0).getDate(), hi = kunci(new Date());
        let c = "";
        for (let i = 0; i < off; i++) c += "<span></span>";
        for (let d = 1; d <= n; d++) {
          const k = kunci(new Date(cal.y, cal.m, d)), L = by[k] || [];
          c += `<button class="cd ${k === hi ? "today" : ""} ${k === cal.sel ? "sel" : ""}" data-day="${k}">${d}<span class="dots">${L.slice(0, 3).map((l) => `<i class="dot ${hitung(l)[0]}"></i>`).join("")}</span></button>`;
        }
        const pil = (cal.sel && by[cal.sel]) || [];
        return (
          `<div class="card" style="margin-top:12px"><div class="calh"><button class="btn alt sm" data-cal="-1" aria-label="Bulan lalu">‹</button><b>${first.toLocaleDateString("id-ID", { month: "long", year: "numeric" })}</b><span><button class="btn alt sm" data-cal="0">Hari ini</button> <button class="btn alt sm" data-cal="1" aria-label="Bulan depan">›</button></span></div>
      <div class="cg">${["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map((x) => `<small>${x}</small>`).join("")}${c}</div></div>` +
          (cal.sel ? `<h3>${fmtDl(cal.sel)}</h3>` + (pil.map(kartu).join("") || '<div class="card empty">Tidak ada deadline di tanggal ini.</div>') : '<div class="muted" style="text-align:center">Ketuk tanggal untuk melihat lomba.</div>')
        );
      }

      function vRiwayat() {
        return `<div class="card" style="margin-top:12px">${
          D.riwayat.map((r) => `<div class="log">
    <div class="t">${esc(r.oleh)} ${esc(String(r.aksi).toLowerCase())} ${esc(r.lomba)}</div>
    ${r.rincian ? `<div class="muted" style="overflow-wrap:anywhere">${esc(r.rincian)}</div>` : ""}
    <div class="muted" style="font-size:.78rem">${fmtWaktu(r.waktu)}</div></div>`).join("") || '<div class="empty">Belum ada riwayat.</div>'
        }</div>`;
      }

      function isiPj() {
        const s = $("#fPj"), v = s.value;
        s.innerHTML = '<option value="">Semua PJ</option>' + D.anggota.map((n) => `<option>${esc(n)}</option>`).join("") + '<option value="-">Tanpa PJ</option>';
        s.value = v;
      }
      function render() {
        isiPj();
        $("#ringkas").innerHTML = vRingkas();
        $("#tools").classList.toggle("hide", tab === "riwayat");
        $("#view").innerHTML = { lomba: vLomba, timeline: vTimeline, kalender: vKalender, riwayat: vRiwayat }[tab]();
      }

      /* ---------- Utilitas ---------- */
      const ymd = (s) => String(s).replace(/-/g, "");
      const esok = (s) => { const d = tglDl(s); d.setDate(d.getDate() + 1); return ymd(kunci(d)); };
      const ie = (s) => String(s).replace(/[\\,;]/g, "\\$&").replace(/\n/g, "\\n");
      function unduh(nama, teks, tipe) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([teks], { type: tipe }));
        a.download = nama; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      function ingat() {
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        const h = new Date().toDateString(), u = urgent();
        if (store.get("niknos_ingat") === h || !u.length) return;
        store.set("niknos_ingat", h);
        new Notification("Lomba Tracker", { body: u.slice(0, 4).map((x) => `${x.l.nama}: ${x.t}`).join("\n") });
      }

      /* ---------- Interaksi ---------- */
      document.querySelectorAll(".tabs button").forEach(
        (b) => (b.onclick = () => {
          tab = b.dataset.tab;
          document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
          render();
        }),
      );
      ["#q", "#fSt", "#fPj", "#fKat"].forEach((s) => $(s).addEventListener("input", render));

      function buka(l) {
        const f = $("#fLomba"), m = l ? mt(l.id) : {};
        f.reset();
        $("#dJudul").textContent = l ? "Ubah lomba" : "Tambah lomba";
        $("#fmPj").innerHTML = '<option value="">Belum ditentukan</option>' + D.anggota.map((n) => `<option>${esc(n)}</option>`).join("");
        f.id.value = l ? l.id : "";
        if (l) {
          f.nama.value = l.nama; f.deadline.value = l.deadline;
          f.registrasi.checked = l.registrasi === "Sudah"; f.catatan.value = l.catatan;
        }
        f.kat.value = m.kat || ""; f.pj.value = m.pj || ""; f.link.value = m.link || "";
        $("#dLomba").showModal();
      }
      $("#bTambah").onclick = () => buka(null);
      $("#bBatal").onclick = () => $("#dLomba").close();

      $("#fLomba").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target, sebelum = new Set(D.lomba.map((x) => x.id));
        const isi = { nama: f.nama.value, deadline: f.deadline.value, registrasi: f.registrasi.checked, catatan: f.catatan.value };
        const edit = f.id.value;
        const ok = await api(edit ? { action: "ubah", id: edit, ...isi } : { action: "tambah", ...isi });
        if (ok) {
          const id = edit || (D.lomba.find((x) => !sebelum.has(x.id)) || {}).id;
          if (id) {
            let lk = f.link.value.trim();
            if (lk && !/^https?:\/\//i.test(lk)) lk = "https://" + lk;
            upM(id, { kat: f.kat.value, pj: f.pj.value, link: lk });
          }
          $("#dLomba").close(); render();
          toast(edit ? "Perubahan tersimpan" : "Lomba ditambahkan");
        }
      });

      const tambahCl = (id) => {
        const i = [...document.querySelectorAll("[data-ci]")].find((x) => x.dataset.ci === id);
        const t = i && i.value.trim();
        if (!t) return;
        upM(id, { cl: [...(mt(id).cl || []), { t, d: false }] }); render();
      };

      $("#view").addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const d = b.dataset;
        if (d.progres) {
          const l = D.lomba.find((x) => x.id === d.id);
          if (l && l.progres !== d.progres && (await api({ action: "ubah", id: d.id, progres: d.progres }))) toast("Progres diperbarui");
        } else if (d.reg) {
          if (await api({ action: "ubah", id: d.id, registrasi: d.reg === "1" })) toast("Status registrasi diperbarui");
        } else if (d.edit) buka(D.lomba.find((x) => x.id === d.edit));
        else if (d.del) {
          if (d.sure) {
            if (await api({ action: "hapus", id: d.del })) { delete M[d.del]; store.set("niknos_meta", JSON.stringify(M)); toast("Lomba dihapus"); }
          } else { d.sure = 1; b.textContent = "Tekan lagi untuk hapus"; b.style.color = "var(--bad)"; }
        } else if (d.pin) { upM(d.pin, { pin: !mt(d.pin).pin }); render(); }
        else if (d.ca) tambahCl(d.ca);
        else if (d.cx) { const cl = [...(mt(d.id).cl || [])]; cl.splice(+d.cx, 1); upM(d.id, { cl }); render(); }
        else if (d.tpl) { upM(d.tpl, { cl: TPL.map((t) => ({ t, d: false })) }); render(); }
        else if (d.cal !== undefined) {
          if (d.cal === "0") { const n = new Date(); cal = { y: n.getFullYear(), m: n.getMonth(), sel: kunci(n) }; }
          else { const n = new Date(cal.y, cal.m + +d.cal, 1); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = null; }
          render();
        } else if (d.day) { cal.sel = cal.sel === d.day ? null : d.day; render(); }
      });
      $("#view").addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.ck === undefined) return;
        const cl = (mt(t.dataset.id).cl || []).map((c, i) => (i === +t.dataset.ck ? { ...c, d: t.checked } : c));
        upM(t.dataset.id, { cl }); render();
      });
      $("#view").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.dataset.ci) { e.preventDefault(); tambahCl(e.target.dataset.ci); }
      });

      /* ---------- Alat bantu ---------- */
      $("#bAlat").onclick = () => $("#dAlat").showModal();
      $("#aTutup").onclick = () => $("#dAlat").close();
      $("#aIcs").onclick = () => {
        const ev = D.lomba.filter((l) => !isNaN(sisa(l.deadline))).map((l) => [
          "BEGIN:VEVENT", `UID:${l.id}@lomba-tracker`, `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g, "")}`,
          `SUMMARY:${ie("Deadline: " + l.nama)}`, `DTSTART;VALUE=DATE:${ymd(l.deadline)}`, `DTEND;VALUE=DATE:${esok(l.deadline)}`,
          `DESCRIPTION:${ie((l.catatan || "") + " (" + l.progres + ")")}`,
          "BEGIN:VALARM", "TRIGGER:-P3D", "ACTION:DISPLAY", "DESCRIPTION:Deadline 3 hari lagi", "END:VALARM",
          "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:Deadline besok", "END:VALARM", "END:VEVENT"].join("\r\n"));
        unduh("lomba-deadline.ics", ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lomba Tracker//ID", ...ev, "END:VCALENDAR"].join("\r\n"), "text/calendar");
        toast("File kalender diunduh");
      };
      $("#aRekap").onclick = async () => {
        const t = `*Rekap Lomba* — ${new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" })}\n` +
          D.lomba.filter((l) => !selesai(l)).sort(urut).map((l, i) => `${i + 1}. ${l.nama} — ${hitung(l)[1]} (${l.progres}${l.registrasi === "Sudah" ? "" : ", belum registrasi"}${mt(l.id).pj ? ", PJ " + mt(l.id).pj : ""})`).join("\n");
        try { await navigator.clipboard.writeText(t); toast("Rekap disalin, tinggal tempel"); } catch { toast("Gagal menyalin. Izinkan akses clipboard."); }
      };
      $("#aNotif").onclick = async () => {
        if (!("Notification" in window)) return toast("Browser tidak mendukung notifikasi");
        const p = await Notification.requestPermission();
        toast(p === "granted" ? "Pengingat aktif, muncul saat aplikasi dibuka" : "Izin notifikasi ditolak");
        if (p === "granted") ingat();
      };
      $("#aBackup").onclick = () => unduh("lomba-tracker-backup.json", JSON.stringify({ meta: M }), "application/json");
      $("#aRestore").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        try { const j = JSON.parse(await f.text()); if (!j.meta) throw 0; M = { ...M, ...j.meta }; store.set("niknos_meta", JSON.stringify(M)); render(); toast("Backup dipulihkan"); }
        catch { toast("File backup tidak valid"); }
        e.target.value = "";
      };

      /* ---------- Tema & mulai ---------- */
      const tema = (t) => { document.documentElement.dataset.theme = t; store.set("niknos_tema", t); $("#bTema").textContent = t === "dark" ? "☀️" : "🌙"; };
      tema(store.get("niknos_tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      $("#bTema").onclick = () => tema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

      const optKat = '<option value="">Tanpa kategori</option>' + KAT.map((k) => `<option>${k}</option>`).join("");
      $("#fmKat").innerHTML = optKat;
      $("#fKat").innerHTML = '<option value="">Semua kategori</option>' + KAT.map((k) => `<option>${k}</option>`).join("");
      $("#me").innerHTML = D.anggota.map((n) => `<option>${n}</option>`).join("");
      if (D.anggota.includes(store.get("niknos_me"))) $("#me").value = store.get("niknos_me");
      $("#me").onchange = () => store.set("niknos_me", me());
      render();
      api();
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !$("#dLomba").open) api();
      });
    </script>
  </body>
</html>
